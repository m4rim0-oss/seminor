<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>経済史ホームページ（試作）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
     :root {
      --col-blue:        #2a6f97;
      --col-bg:      #faf8f5;
      --col-surface: #f0ebe1;
      --col-card:    #e3ded5;
      --col-text:    #1c2541;
      --col-muted:   #474f63;
      --col-accent:  #d97d41;
      --col-footer:  #e9e4db;
      --col-border:  rgba(28, 37, 65, 0.15);
      }

 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

 html { scroll-behavior: smooth; }

  body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--col-bg);
      color: var(--col-text);
      line-height: 1.8;
      font-weight: 400;
    }

    /*Header*/
    header{
          background: var(--col-blue);
      padding: 0 32px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(42, 111, 151, 0.15);
        
    }


</style>
</head>
<body>
    こんにちは　こちら経済史のゼミです 
</body>
</html>
